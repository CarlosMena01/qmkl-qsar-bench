[project]
name = "qmkl-bench"
version = "0.1.0"
description = "Reproducible benchmark of quantum vs. classical kernels (QSVM / QMKL) for tabular binary classification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.5",
    "qiskit>=1.2,<3",
    "qiskit-aer>=0.15",
    "mlflow>=2.14",
    "typer>=0.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.scripts]
bench = "qmkl_bench.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmkl_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
